 y1="108" x2="274" y2="108" class="messageLine0" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="175" y="79" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Hello Bob, how are you?</text></g><g class="messageLine"><line x1="274" y1="151" x2="76" y2="151" class="messageLine1" stroke="#333" stroke-width="1.5" stroke-dasharray="3, 3" marker-end="url(#arrowhead)"/><text x="175" y="122" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">I'm good thanks!</text></g><g class="messageLine"><line x1="76" y1="194" x2="474" y2="194" class="messageLine0" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="275" y="165" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Hi Charlie</text></g><g class="messageLine"><line x1="474" y1="237" x2="76" y2="237" class="messageLine1" stroke="#333" stroke-width="1.5" stroke-dasharray="3, 3" marker-end="url(#arrowhead)"/><text x="275" y="208" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Hey Alice!</text></g><g class="messageLine"><line x1="276" y1="280" x2="474" y2="280" class="messageLine0" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="375" y="251" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Hi there</text></g><g class="messageLine"><line x1="474" y1="323" x2="276" y2="323" class="messageLine1" stroke="#333" stroke-width="1.5" stroke-dasharray="3, 3" marker-end="url(#arrowhead)"/><text x="375" y="294" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Hello!</text></g><g class="messageLine"><line x1="76" y1="366" x2="274" y2="366" class="messageLine0" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="175" y="337" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Can you help me?</text></g><g class="messageLine"><line x1="274" y1="409" x2="76" y2="409" class="messageLine1" stroke="#333" stroke-width="1.5" stroke-dasharray="3, 3" marker-end="url(#arrowhead)"/><text x="175" y="380" class="messageText" text-anchor="middle" dominant-baseline="middle" alignment-baseline="middle" dy="1em" font-size="16.0px" font-family="'trebuchet ms', verdana, arial, sans-serif" fill="#333">Sure, what do you need?</text></g></g><g class="actors"><g><g><rect x="0" y="444" width="150" height="65" class="actor actor-bottom" fill="#ECECFF" stroke="#9370DB" rx="3" ry="3" name="Alice"/><text x="75" y="476.5" class="actor" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="14.0px" font-family="'Open Sans', sans-serif" fill="#333">Alice</text></g></g><g><g><rect x="200" y="444" width="150" height="65" class="actor actor-bottom" fill="#ECECFF" stroke="#9370DB" rx="3" ry="3" name="Bob"/><text x="275" y="476.5" class="actor" text-anchor="middle" dominant-baseline="central" alignment-baseline="central" font-size="14.0px" font-family="'Open Sans', sans-serif" fill="#333">Bob</text></g></g><g><g><rect x="400" y="444" width="150" height="65" class="actor actor-bottom" fill="#ECECFF" stroke="#9370DB" rx="3" ry="3" name="C