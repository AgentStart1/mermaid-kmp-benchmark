<svg id="benchmark" class="sequenceDiagram" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-50 -10 650 519" width="100%" style="max-width: 650px;" height="519.0"><defs><style>.actor {
