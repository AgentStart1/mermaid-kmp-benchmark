name: Mermaid KMP benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish report to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: python -m unittest discover -s tests
      - name: Measure
        run: python run_benchmarks.py --profile ${{ github.event_name == 'pull_request' && 'smoke' || 'standard' }}
      - name: Verify SVG validation
        run: ./gradlew :bench:test --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mermaid-kmp-benchmark
          path: |
            report.html
            results/
            libraries.lock.json
            discovery.json
            discovery-source-comparison.json
            test-data/provenance.json
      - name: Prepare Pages bundle
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          mkdir -p public
          cp report.html public/index.html
          cp -r results public/results
          cp libraries.lock.json discovery.json discovery-source-comparison.json public/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        with:
          path: public
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
